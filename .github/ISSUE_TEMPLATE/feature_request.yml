name: Feature request
description: Something claude-switch could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: A command, an option or a change of behavior, if you have one in mind.
